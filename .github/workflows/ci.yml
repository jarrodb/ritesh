name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Protocol types and Go schema copy are in sync
        run: npm run sync:protocol && git diff --exit-code
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: publint, attw, size-limit, pack and import
        run: npm run check:package

  go:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: server
      - run: go test -race -count=1 ./...
