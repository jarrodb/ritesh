name: Bug
description: Something in rite behaves wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The line you typed, what rite printed, and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ritesh version and browser
    validations:
      required: true
